# Universal x86-64 Dell laptop kernel profile

PROFILE_NAME="dell"
PROFILE_VERSION="0.1"

# Build policy
#
# KernelForge is intended to be run on the target Dell laptop. Native CPU
# optimization is therefore safe for the locally built kernel, while the
# hardware allowlist below remains independent from the current host inventory.
PROCESSOR_OPT="native"
TICKRATE="idle"

# Profile invariants changed deliberately by KernelForge.
REQUIRE_ENABLED_BOOL=(
    X86_NATIVE_CPU
    NO_HZ_IDLE
)

REQUIRE_DISABLED=(
    NO_HZ_FULL
    HZ_PERIODIC
)

# Universal Dell laptop contract. These are ordinary laptop facilities that must
# remain available regardless of which Dell laptop performs the build.
PRESERVE_ENABLED=(
    ACPI
    ACPI_AC
    ACPI_BATTERY
    ACPI_BUTTON
